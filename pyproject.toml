[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myaichart"
version = "0.1.0"
description = "Research-first XAUUSD evidence collector and realtime/replay chart workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3",
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "httpx>=0.27,<1",
  "python-dateutil>=2.9,<3",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<17"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]
parquet = ["pyarrow>=17,<20"]

[project.scripts]
myaichart = "myaichart.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
