name: ModeMenu JVM checks
on:
  push:
    branches: [develop/native-modmenu-v1]
    paths:
      - 'mt-native-modmenu/**'
      - '.github/workflows/modmenu-state-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pure-kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download Kotlin compiler
        run: |
          curl -fL --retry 3 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
      - name: Test immutable menu state
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ModeMenuState.kt mt-native-modmenu/tests/ModeMenuStateTests.kt -include-runtime -d /tmp/menu.jar
          java -jar /tmp/menu.jar
      - name: Test chart projection
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ChartProjection.kt mt-native-modmenu/tests/ChartProjectionTests.kt -include-runtime -d /tmp/chart.jar
          java -jar /tmp/chart.jar
