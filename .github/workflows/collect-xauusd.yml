name: Collect XAUUSD
on:
  workflow_dispatch:
    inputs:
      months: {description: 'Months of history', required: true, default: '6'}
      timezone: {description: 'Display timezone', required: true, default: 'Asia/Kuala_Lumpur'}
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[test,parquet]'
      - run: myaichart collect XAUUSD --months ${{ inputs.months }}
      - run: myaichart verify XAUUSD
      - run: myaichart aggregate XAUUSD --timeframes M1 M5 M15 M30 H1 H4 D1 W1 MN1
      - run: myaichart events sync
      - run: myaichart effects build XAUUSD
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with:
          name: xauusd-evidence
          path: |
            data/metadata
            data/processed
          if-no-files-found: warn
