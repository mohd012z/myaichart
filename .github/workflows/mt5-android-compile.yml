name: MT5 BBMA Android source compilation
on:
  push:
    branches: [develop/native-modmenu-v1]
    paths:
      - 'mt-native-modmenu/**'
      - '.github/workflows/mt5-android-compile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform 35
        run: |
          echo y | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35'
      - name: Download Kotlin compiler
        run: |
          curl -fL --retry 3 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
      - name: Compile native Android BBMA source
        run: |
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          ./kotlinc/bin/kotlinc -classpath "$ANDROID_HOME/platforms/android-35/android.jar" \
            mt-native-modmenu/src/Indicators.kt \
            mt-native-modmenu/src/ChartProjection.kt \
            mt-native-modmenu/src/ChartHostContract.kt \
            mt-native-modmenu/src/BbmaOverlayView.kt \
            mt-native-modmenu/src/HunterChartOverlay.kt \
            mt-native-modmenu/src/ModeMenuState.kt \
            mt-native-modmenu/src/MenuPlacement.kt \
            mt-native-modmenu/src/ResponsiveMenu.kt \
            mt-native-modmenu/src/FundamentalResearch.kt \
            mt-native-modmenu/src/PolicyLanguage.kt \
            mt-native-modmenu/src/SymbolCatalog.kt \
            mt-native-modmenu/src/OverlayControls.kt \
            mt-native-modmenu/src/SupplyDemand.kt \
            mt-native-modmenu/src/ZoneLifecycle.kt \
            mt-native-modmenu/src/ZoneProjection.kt \
            mt-native-modmenu/src/SupplyDemandOverlayView.kt \
            mt-native-modmenu/src/EconomicCalendar.kt \
            mt-native-modmenu/src/CandleCapture.kt \
            mt-native-modmenu/src/BbmaSymbolSelector.kt \
            mt-native-modmenu/src/ResearchEvidenceGate.kt \
            mt-native-modmenu/src/ChartScreenshotCapture.kt \
            mt-native-modmenu/src/ScreenshotPreview.kt \
            mt-native-modmenu/src/ResearchSourceFetcher.kt \
            mt-native-modmenu/src/ModeMenuPanel.kt \
            -d /tmp/mt5-bbma-android-classes.jar
      - name: Verify menu placement
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/MenuPlacement.kt mt-native-modmenu/tests/MenuPlacementTests.kt -include-runtime -d /tmp/menu-placement.jar
          java -jar /tmp/menu-placement.jar
      - name: Verify responsive menu and persistence geometry
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ResponsiveMenu.kt mt-native-modmenu/tests/ResponsiveMenuTests.kt -include-runtime -d /tmp/responsive-menu.jar
          java -jar /tmp/responsive-menu.jar
      - name: Verify fundamental evidence classifier
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/FundamentalResearch.kt mt-native-modmenu/tests/FundamentalResearchTests.kt -include-runtime -d /tmp/fundamental.jar
          java -jar /tmp/fundamental.jar
      - name: Validate official-source evidence
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ResearchEvidenceGate.kt mt-native-modmenu/tests/ResearchEvidenceGateTests.kt -include-runtime -d /tmp/research-evidence.jar
          java -jar /tmp/research-evidence.jar
      - name: Verify policy language negation
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/FundamentalResearch.kt mt-native-modmenu/src/PolicyLanguage.kt mt-native-modmenu/tests/PolicyLanguageTests.kt -include-runtime -d /tmp/policy-language.jar
          java -jar /tmp/policy-language.jar
      - name: Verify event mapping and symbol catalog
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/Indicators.kt mt-native-modmenu/src/ChartProjection.kt mt-native-modmenu/src/SymbolCatalog.kt mt-native-modmenu/src/EconomicCalendar.kt mt-native-modmenu/tests/EconomicCalendarTests.kt -include-runtime -d /tmp/economic-events.jar
          java -jar /tmp/economic-events.jar
      - name: Verify independent overlay controls
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/OverlayControls.kt mt-native-modmenu/tests/OverlayControlsTests.kt -include-runtime -d /tmp/overlay-controls.jar
          java -jar /tmp/overlay-controls.jar
      - name: Verify supply demand zone research
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/Indicators.kt mt-native-modmenu/src/SupplyDemand.kt mt-native-modmenu/tests/SupplyDemandTests.kt -include-runtime -d /tmp/supply-demand.jar
          java -jar /tmp/supply-demand.jar
      - name: Verify supply demand zone replay and projection
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/Indicators.kt mt-native-modmenu/src/ChartProjection.kt mt-native-modmenu/src/SupplyDemand.kt mt-native-modmenu/src/ZoneLifecycle.kt mt-native-modmenu/src/ZoneProjection.kt mt-native-modmenu/tests/ZoneProjectionTests.kt -include-runtime -d /tmp/zone-replay.jar
          java -jar /tmp/zone-replay.jar
      - name: Run pure Kotlin regression tests
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/Indicators.kt mt-native-modmenu/tests/IndicatorTests.kt -include-runtime -d /tmp/indicators.jar
          java -jar /tmp/indicators.jar
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ChartProjection.kt mt-native-modmenu/tests/ChartProjectionTests.kt -include-runtime -d /tmp/projection.jar
          java -jar /tmp/projection.jar
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ModeMenuState.kt mt-native-modmenu/tests/ModeMenuStateTests.kt -include-runtime -d /tmp/menu.jar
          java -jar /tmp/menu.jar
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/ChartProjection.kt mt-native-modmenu/src/ChartHostContract.kt mt-native-modmenu/tests/ChartHostContractTests.kt -include-runtime -d /tmp/host.jar
          java -jar /tmp/host.jar
