name: Native ModeMenu JVM verification
on:
  push:
    branches: [develop/native-modmenu-v1]
    paths: ['mt-native-modmenu/**', '.github/workflows/native-modmenu-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  indicators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Kotlin
        run: |
          curl -fsSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q kotlin.zip
      - name: Test BBMA and Fibonacci
        run: |
          ./kotlinc/bin/kotlinc mt-native-modmenu/src/Indicators.kt mt-native-modmenu/tests/IndicatorTests.kt -include-runtime -d /tmp/indicators.jar
          java -jar /tmp/indicators.jar
