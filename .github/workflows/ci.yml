name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e '.[test,parquet]'
      - run: pytest -q
      - uses: actions/setup-node@v7
        with: {node-version: '22'}
      - run: node tests/web/test_frontend_contract.mjs

  source-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/realtime-xauusd'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: '3.12'}
      - run: pip install -e '.[test,parquet]'
      - name: Fetch one real XAUUSD hour
        run: >-
          myaichart --data-dir smoke-data collect XAUUSD
          --from "2026-09-23 20:00:00"
          --to "2026-09-23 20:59:59"
      - name: Verify real ticks
        run: |
          python - <<'PY'
          from pathlib import Path
          from myaichart.data.integrity import verify_dataset
          report=verify_dataset(Path('smoke-data'),'XAUUSD')
          print(report)
          assert report['raw_tick_count'] > 0, report
          assert report['first_tick_utc'] is not None, report
          assert report['last_tick_utc'] is not None, report
          PY
      - run: myaichart --data-dir smoke-data aggregate XAUUSD --timeframes M1 M5
      - name: Verify processed candles
        run: |
          python - <<'PY'
          from pathlib import Path
          from myaichart.data.candles import CandleStore
          store=CandleStore(Path('smoke-data'))
          m1=list(store.read('XAUUSD','M1'))
          m5=list(store.read('XAUUSD','M5'))
          print({'M1':len(m1),'M5':len(m5)})
          assert m1 and m5
          PY
